name: Daily Startup Scout

# Automated daily discovery of startups for spontaneous applications.
# Runs every day at 16:00 UTC (18:00 Germany CEST / 17:00 CET in winter) and
# can also be triggered manually. GitHub cron is UTC-only and ignores DST.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}

# Allow the workflow to push the updated visited_startups.json back to the repo.
permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      # a) Check out the repository.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # b) Run the scout. SMTP settings are injected from repository secrets.
      - name: Run Startup Scout
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      # c) Commit and push any changes to visited_startups.json.
      - name: Commit updated state
        run: |
          git config user.name "startup-scout-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain visited_startups.json)" ]; then
            git add visited_startups.json
            git commit -m "chore: update visited startups [skip ci]"
            git push
          else
            echo "No changes to visited_startups.json — nothing to commit."
          fi
